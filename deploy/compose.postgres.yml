name: ourtaiko-fanmade
services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: ourtaiko-fanmade-postgres
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      # PostgreSQL 18 stores PGDATA below /var/lib/postgresql/18/docker.
      - /var/lib/ourtaiko-fanmade/postgres:/var/lib/postgresql
      - /etc/ourtaiko-fanmade/database/postgres-password:/run/secrets/postgres_password:ro
      - /etc/ourtaiko-fanmade/database/init.sql:/docker-entrypoint-initdb.d/10-app.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
