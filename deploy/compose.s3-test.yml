name: ourtaiko-fanmade-s3-test
services:
  fanmade:
    image: ourtaiko-fanmade:s3-test
    container_name: ourtaiko-fanmade-s3-test
    restart: unless-stopped
    env_file:
      - path: /etc/ourtaiko-fanmade/s3-test/api.env
        format: raw
      - path: /etc/ourtaiko-fanmade/s3-test/storage.env
        format: raw
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      STORAGE_DIR: /tmp/staging
      STORAGE_BACKEND: s3
      GAME_ONLY: 'true'
    ports: ['127.0.0.1:8082:8080']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=1g']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [shared]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  shared: {external: true, name: ourtaiko-shared}
